server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # never add text/event-stream here: gzip would hold the stream back
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # hashed build assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # the API (including SSE): same origin, so the frontend only ever requests /api
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;                   # SSE: pass every frame on at once
        proxy_cache off;
        proxy_read_timeout 600s;               # slow gateway + long answers
    }

    location = /docs         { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }
}
