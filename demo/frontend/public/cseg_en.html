<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>证据图长什么样？· 以田径场为例 · CampusScope</title>
<style>
:root{
  --bg:#F4F5FA; --ink:#101828; --ink2:#344054; --ink3:#667085; --ink4:#98A2B3; --line:#E4E7EC; --card:#fff;
  --zgc:#2E6BE6; --zgc-bg:#EAF1FE; --zgc-bd:#B9CFFB; --zgc-ink:#1D4ED8;
  --tz:#E8772E; --tz-bg:#FFF1E7; --tz-bd:#FDCBA6; --tz-ink:#C2410C;
  --rec:#7C5CFA; --rec-bg:#F1EDFF; --rev:#E5484D; --rev-bg:#FFEEEE;
  --ok:#12B76A; --ok-bg:#E7F8EF; --time:#0891B2; --time-bg:#E3F5FA; --warn:#F59E0B; --warn-bg:#FFF6E5;
  --brand:#5B47F0;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.07);
  --font:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 520px at 0% -8%,#ECEEFF 0%,rgba(236,238,255,0) 60%),
             radial-gradient(900px 480px at 105% 0%,#FFF1E6 0%,rgba(255,241,230,0) 55%),var(--bg)}
.app{max-width:1600px;margin:0 auto;padding:16px 22px 14px;display:flex;flex-direction:column;gap:12px;height:100vh;min-height:720px}
/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,#4338CA 0%,#7C5CFA 55%,#F08A3E 100%);box-shadow:0 8px 22px rgba(91,71,240,.32)}
h1{margin:0;font-size:22px;letter-spacing:.3px;white-space:nowrap}
h1 em{font-style:normal;background:linear-gradient(90deg,#4338CA,#7C5CFA 60%,#E8772E);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:3px;color:var(--ink3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.lg{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.85);
  border:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap}
.lg i{display:inline-block}
.sw{width:10px;height:10px;border-radius:3px}
.ln{width:22px;height:0;border-top:2.5px solid}
.ln.rec{border-color:var(--rec)} .ln.rev{border-color:var(--rev);border-top-style:dashed}
/* ---------- stepper ---------- */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.step{position:relative;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.62);border:1px solid var(--line);transition:all .25s ease;text-align:left;font:inherit;color:inherit}
.step:hover{background:#fff;transform:translateY(-1px)}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;
  background:#EEF0F5;color:var(--ink3);transition:all .25s}
.step .t1{font-weight:700;font-size:14px;line-height:1.2}
.step .t2{font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.active{background:#fff;border-color:transparent;box-shadow:0 0 0 2px var(--brand) inset,0 8px 24px rgba(91,71,240,.14)}
.step.active .n{background:linear-gradient(135deg,#4338CA,#7C5CFA);color:#fff;box-shadow:0 4px 12px rgba(91,71,240,.35)}
.step.done .n{background:#E6E2FF;color:var(--brand)}
.step .bar{position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px;background:transparent}
.step.active .bar{background:linear-gradient(90deg,#4338CA,#7C5CFA,#E8772E)}
/* ---------- main ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;flex:1;min-height:0}
.stage{background:#fff;border-radius:22px;box-shadow:var(--shadow);border:1px solid rgba(228,231,236,.9);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 2px;min-height:48px}
.stage-title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-title small{font-weight:500;color:var(--ink3);margin-left:8px;font-size:12px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;background:#F2F4F7;border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:9px;font:inherit;font-size:12.5px;color:var(--ink3);cursor:pointer;white-space:nowrap;transition:all .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.14);font-weight:700}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.switch{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap;background:none;border:0;font-family:inherit;padding:0}
.switch i{width:34px;height:20px;border-radius:999px;background:#D0D5DD;position:relative;transition:.2s;flex:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.2s}
.switch.on i{background:var(--ok)} .switch.on i::after{left:16px}
.switch.hide{display:none}
.canvas{flex:1;position:relative;min-height:0}
.canvas svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .5s ease}
.canvas svg.off{opacity:0;pointer-events:none}
svg text{font-family:var(--font)}
.layer{transition:opacity .5s ease}
.layer.off{opacity:0;pointer-events:none}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.flowdash{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
.pill{cursor:pointer;transition:opacity .35s ease}
.pill .pbody{transition:stroke .3s,fill .3s}
.pill.st-future{opacity:.14}
.pill.st-out,.pill.st-hist-old{opacity:.38}
.pill.st-cur,.pill.st-dropped,.pill.st-hist{opacity:.55}
.pill.st-revised{opacity:.62}
.pill .strike{opacity:0;transition:opacity .3s}
.pill.st-revised .strike{opacity:1}
.pill:hover .pbody{stroke-width:2.2}
.pill.sel .pbody{stroke-width:2.6}
.lane-dim{transition:opacity .35s}
.edge{transition:opacity .35s}
.fact-card{cursor:pointer}
.fact-card.ghost{opacity:.35}
.fact-card .sel-ring{opacity:0;transition:opacity .25s}
.fact-card.sel .sel-ring{opacity:1}
/* ---------- tooltip ---------- */
.tt{position:absolute;z-index:20;pointer-events:none;min-width:230px;max-width:330px;background:rgba(16,24,40,.96);color:#fff;border-radius:12px;
  padding:10px 12px;font-size:12px;line-height:1.6;box-shadow:0 12px 30px rgba(16,24,40,.28);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tt.on{opacity:1;transform:none}
.tt .h{font-weight:700;font-size:13px;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.tt .d{width:8px;height:8px;border-radius:50%;flex:none}
.tt .r{color:#D0D5DD} .tt .r b{color:#fff;font-weight:600}
.tt .q{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.14);color:#EAECF0;font-style:italic}
.tt .id{margin-top:4px;font-family:var(--mono);color:#98A2B3;font-size:11px}
.tt .w{margin-top:6px;color:#FEC84B}
/* ---------- panel ---------- */
.panel{background:#fff;border-radius:22px;box-shadow:var(--shadow);border:1px solid rgba(228,231,236,.9);display:flex;flex-direction:column;min-height:0}
.pbody-wrap{flex:1;overflow:auto;padding:18px 20px 8px;scrollbar-width:thin}
.pnav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .2s}
.btn:hover{border-color:#C7CCD6;background:#FAFAFC}
.btn.primary{background:linear-gradient(135deg,#4338CA,#7C5CFA);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(91,71,240,.3)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:#D0D5DD;transition:all .25s}
.dots i.on{width:20px;border-radius:4px;background:var(--brand)}
.kicker{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--brand)}
.panel h2{font-size:19px;line-height:1.4;margin:6px 0 8px}
.panel p{font-size:13.5px;line-height:1.78;color:var(--ink2);margin:8px 0}
.panel p.muted{color:var(--ink3);font-size:12.5px}
.panel b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;vertical-align:1px;line-height:1.7}
.chip.zgc{background:var(--zgc-bg);color:var(--zgc-ink)} .chip.tz{background:var(--tz-bg);color:var(--tz-ink)}
.chip.time{background:var(--time-bg);color:#0E7490} .chip.grey{background:#F2F4F7;color:#475467}
.chip.rec{background:var(--rec-bg);color:#5B3FD9} .chip.rev{background:var(--rev-bg);color:#C0262D}
.chip.ok{background:var(--ok-bg);color:#067647} .chip.warn{background:var(--warn-bg);color:#B54708}
.callout{border-radius:13px;padding:10px 12px;font-size:13px;line-height:1.72;margin:10px 0}
.callout.red{background:#FFF3F3;color:#8F1D22;border:1px solid #FCD4D4}
.callout.amber{background:#FFF8EB;color:#8A4B0B;border:1px solid #FDE3B0}
.callout.violet{background:#F6F3FF;color:#4A34B8;border:1px solid #E2DBFF}
.callout.blue{background:#F3F7FF;color:#1E4FB8;border:1px solid #D7E4FD}
.callout b{color:inherit}
.quote{font-family:var(--mono);font-size:11.5px;background:#F8F9FB;border:1px dashed #D0D5DD;border-radius:11px;padding:8px 10px;color:#475467;line-height:1.65;margin:8px 0}
.quote .hl{background:#FFE4E4;color:#B42318;border-radius:3px;padding:0 2px}
.quote .hl2{background:#FFF0C2;border-radius:3px;padding:0 2px}
.qh{font-family:var(--font);font-size:11.5px;color:var(--ink3);margin-bottom:4px;font-weight:600}
.file{font-size:12px;color:var(--ink3);background:#F8F9FB;border-radius:11px;padding:8px 10px;margin:10px 0 4px;line-height:1.6}
code{font-family:var(--mono);background:#EEF0F5;padding:1px 5px;border-radius:5px;font-size:11.5px;color:#344054}
ul.kv{list-style:none;padding:0;margin:8px 0}
ul.kv li{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--ink2);padding:5px 0;border-bottom:1px dashed #EEF0F3;line-height:1.55}
ul.kv li:last-child{border-bottom:0}
ul.kv li .chip{flex:none}
.ed{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.7;color:var(--ink2);padding:9px 11px;border-radius:13px;margin:8px 0;border:1px solid var(--line)}
.ed svg{flex:none;margin-top:5px}
.ed.rec{background:#FAF8FF;border-color:#E6E0FF} .ed.rev{background:#FFF8F8;border-color:#FBDADA}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stat span{background:#F5F6FA;border-radius:9px;padding:4px 9px;font-size:12px;color:var(--ink2)}
.stat b{font-size:13px}
.tl{list-style:none;padding:0;margin:8px 0;border-left:2px solid #EDEBFF}
.tl li{position:relative;padding:3px 0 3px 14px;font-size:12.8px;color:var(--ink2);line-height:1.6}
.tl li::before{content:"";position:absolute;left:-6px;top:10px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--rev)}
.tl li.base::before{border-color:var(--zgc)}
.tl li b{font-weight:700}
/* inheritance chain */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#F2F4F7;border-radius:12px;padding:3px;margin:10px 0 6px}
.fgrid button{border:0;background:transparent;padding:7px 9px;border-radius:9px;font:inherit;font-size:12.5px;color:var(--ink3);cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fgrid button:hover{color:var(--ink)}
.fgrid button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.14);font-weight:700}
.chain{margin:6px 0 4px;display:flex;flex-direction:column;gap:9px}
.crow{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:start}
.clabel{font-size:12px;font-weight:800;color:var(--ink3);padding-top:4px}
.csteps{display:flex;flex-wrap:wrap;gap:3px 2px;align-items:center}
.cs{font-size:11.5px;padding:3px 7px;border-radius:8px;background:#F2F4F7;color:#98A2B3;opacity:0;transform:translateY(5px);animation:pop .35s forwards;line-height:1.35;text-align:center}
.cs small{display:block;font-size:10px;font-weight:500;opacity:.9}
.cs.hit{font-weight:800;box-shadow:0 0 0 1.5px currentColor inset}
.cs.hit.zgc{background:var(--zgc-bg);color:var(--zgc-ink)} .cs.hit.tz{background:var(--tz-bg);color:var(--tz-ink)}
.cs.hit.time{background:var(--time-bg);color:#0E7490} .cs.hit.grey{background:#EEF0F5;color:#344054}
.cs.skip{background:transparent;color:#C8CDD6;text-decoration:line-through}
.carr{color:#C0C6D2;font-size:11px;opacity:0;animation:pop .35s forwards}
@keyframes pop{to{opacity:1;transform:none}}
/* step 5 controls */
.qcard{border-radius:15px;padding:10px 13px;background:linear-gradient(135deg,#F5F3FF,#FFF6EE);border:1px solid #ECE8FF;margin:6px 0 8px}
.qcard .qt{font-size:16px;font-weight:800;color:var(--ink)}
.qcard .qm{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.ctrl{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;margin:5px 0}
.ctrl>label{font-size:12px;font-weight:800;color:var(--ink3)}
.ctrl .seg{justify-self:start}
.daterow{display:flex;align-items:center;gap:10px}
.daterow b{font-family:var(--mono);font-size:13px;min-width:86px}
input[type=range]{width:100%;accent-color:var(--brand)}
.presets{display:flex;flex-wrap:nowrap;gap:6px;margin:6px -20px 4px;padding:2px 20px 6px;overflow-x:auto;scrollbar-width:thin;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 28px),transparent 100%)}
.preset{flex:none}
.preset{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;color:var(--ink2);cursor:pointer;transition:all .2s}
.preset:hover{border-color:#B8AEFF;color:var(--brand)}
.preset.on{background:#F1EEFF;border-color:#B8AEFF;color:#4A34B8;font-weight:700}
.conds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 10px}
.conds-h{font-size:12px;font-weight:800;color:var(--ink3);margin-top:14px}
.cond{display:flex;gap:7px;align-items:flex-start;background:#F8F9FB;border-radius:11px;padding:7px 9px;font-size:12px;line-height:1.45;color:var(--ink2)}
.cond .ci{flex:none;width:19px;height:19px;border-radius:50%;background:#fff;border:1.5px solid #D0D5DD;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink3)}
.cond small{display:block;color:var(--ink4);font-family:var(--mono);font-size:10.5px}
.rs{display:grid;grid-template-columns:22px 1fr;gap:8px;margin:8px 0;align-items:start}
.rn{width:22px;height:22px;border-radius:50%;background:#EEF0F5;color:var(--ink3);font-size:12px;font-weight:800;display:grid;place-items:center}
.rt{font-size:13px;line-height:1.7;color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{font-size:11.5px;border-radius:8px;padding:2px 8px;background:#F2F4F7;color:#475467;font-weight:600}
.tag.ok{background:var(--ok-bg);color:#067647} .tag.rec{background:var(--rec-bg);color:#5B3FD9} .tag.rev{background:var(--rev-bg);color:#C0262D}
.br{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.brc{border-radius:11px;padding:7px 9px;font-size:12px;line-height:1.55;border:1px solid}
.brc.zgc{background:#F5F8FF;border-color:#D7E4FD} .brc.tz{background:#FFF8F2;border-color:#FDDCC4} .brc.all{background:#F8F9FB;border-color:#E4E7EC}
.brc .bh{font-weight:800;font-size:11.5px;margin-bottom:2px}
.brc.zgc .bh{color:var(--zgc-ink)} .brc.tz .bh{color:var(--tz-ink)}
.brc.pick{box-shadow:0 0 0 2px var(--ok) inset}
.costs{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.cost{display:grid;grid-template-columns:78px 1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--ink2)}
.cost .track{height:10px;border-radius:6px;background:#F2F4F7;overflow:hidden}
.cost .fill{height:100%;border-radius:6px;background:#C9CED8;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.cost.win .fill{background:linear-gradient(90deg,#12B76A,#32D583)}
.cost.win{font-weight:800;color:#067647}
.cost .v{font-family:var(--mono);text-align:right}
.formula{font-family:var(--mono);font-size:11px;color:var(--ink4);margin-top:4px;line-height:1.6}
.bubble{position:relative;margin-top:6px;border-radius:14px 14px 14px 4px;background:#101828;color:#fff;padding:11px 13px;font-size:13px;line-height:1.75;white-space:pre-line;box-shadow:0 10px 24px rgba(16,24,40,.18)}
.bubble .bh2{font-size:11px;color:#98A2B3;margin-bottom:3px;font-weight:600}
.insp{margin-top:12px;border-radius:15px;border:1px solid var(--line);padding:11px 12px;background:#FCFCFD}
.insp .ih{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.insp .ih b{font-size:13.5px}
.insp .x{border:0;background:#F2F4F7;border-radius:8px;width:24px;height:24px;cursor:pointer;color:var(--ink3);font-size:14px}
.chk{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:12.5px;line-height:1.55;padding:3px 0;color:var(--ink2)}
.chk .m{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;margin-top:1px}
.chk .m.y{background:var(--ok)} .chk .m.n{background:#F04438} .chk .m.z{background:#98A2B3}
.verdict{margin-top:6px;font-size:12.5px;font-weight:800;padding:6px 9px;border-radius:9px}
.verdict.y{background:var(--ok-bg);color:#067647} .verdict.n{background:#F2F4F7;color:#475467} .verdict.h{background:var(--rec-bg);color:#5B3FD9}
.kvs{display:grid;grid-template-columns:62px 1fr;gap:3px 8px;font-size:12px;line-height:1.55;margin-top:6px;color:var(--ink2)}
.kvs span:nth-child(odd){color:var(--ink4);font-weight:600}
.foot{font-size:11.5px;color:var(--ink4);display:flex;justify-content:space-between;gap:16px}
.foot code{font-size:11px}
.selftest{position:fixed;right:16px;bottom:16px;background:#101828;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;font-family:var(--mono);z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@media (max-width:1180px){
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .canvas{flex:none;height:auto;aspect-ratio:1100/700;min-height:0}
  .stage-bar{flex-wrap:wrap}
  .step .t2{display:none}
  .legend{display:none}
}
</style>
</head>

function recEdges(){

function noticeRec(){

function chainHTML(f){
  const c = f.campus, heads = [...f.path];              // deepest first
  const steps = ['事实本身', ...heads, '通知', '地名表'];
  const hitIdx = {campus: 1 + heads.indexOf(CAMPUS[c]), aud: steps.length - 2, valid: steps.length - 2};
  const row = (label, hit, val, cls, noGaz) => {
    let h = '', delay = 0;
    steps.forEach((s, i) => {
      if(noGaz && i === steps.length - 1) return;
      const state = i < hit ? 'miss' : (i === hit ? 'hit ' + cls : 'skip');
      const sub = i === 0 && i < hit ? '<small>引文没写</small>' : (i === hit ? `<small>${esc(val)}</small>` : '');
      h += `<span class="cs ${state}" style="animation-delay:${delay}ms">${esc(s)}${sub}</span>`;
      delay += 140;
      if(i < steps.length - (noGaz ? 2 : 1)) h += `<span class="carr" style="animation-delay:${delay-70}ms">▷</span>`;
    });
    return `<div class="crow"><div class="clabel">${label}</div><div class="csteps">${h}</div></div>`;
  };
  return `<div class="chain">${row('校区', hitIdx.campus, CSHORT[c], c, false)}${row('人群', hitIdx.aud, f.aud, 'grey', true)}${row('有效期', hitIdx.valid, vShort(f), 'time', true)}</div>`;
}

  const s = r.st[f.id], used = r.used.some(x => x.id === f.id);
  const mark = v => v === true ? '<span class="m y">✓</span>' : (v === false ? '<span class="m n">✕</span>' : '<span class="m z">–</span>');
  const Tt = r.cycle ? `${r.cycle[1]} 寒假` : `今天 ${md(S.t)}`;
  const c1 = S.campus ? (!f.campus || f.campus === S.campus) : null;
  const c2 = f.pub <= S.t, c3 = covers(f, r.lo, r.hi), revs = r.revBy[f.id];
  const revTxt = revs ? `被「${[...new Set(revs.map(id => d.facts.find(x => x.id === id).label))].join('、')}」改写（${[...new Set(revs.map(id => noticeOf(d, d.facts.find(x => x.id === id)).short))].join('、')}）` : '没有生效中的修订';
  let verdict, vc;
  if(S.fix && ERR.has(f.id)){ verdict = '已按原文更正去掉'; vc = 'n'; }
  else if(used && r.mode === 'history'){ verdict = '作为往年参考被用上'; vc = 'h'; }
  else if(used){ verdict = '适用，出现在答复里'; vc = 'y'; }
  else if(r.mode === 'ask' && s === 'cur'){ verdict = '适用，但系统选择先追问校区'; vc = 'y'; }
  else if(s === 'cur' && S.campus && f.campus && f.campus !== S.campus){ verdict = '属于另一个校区，不用'; vc = 'n'; }
  else if(s === 'dropped'){ verdict = '常设安排，回答不了假期问题'; vc = 'n'; }
  else if(s === 'hist'){ verdict = '往年候选（本期有事实，所以没用）'; vc = 'n'; }
  else verdict = {future:'还没发布，看不见', revised:'已被新通知改写', out:'有效期不含所问时段', 'hist-old':'更早的往年，被更近的一期取代'}[s] || '不适用', vc = 'n';
  return `<div class="insp"><div class="ih"><b>${esc(f.entity)} · ${esc(f.label)}</b><button class="x" id="inspX">×</button></div>
    <div class="chk">${mark(c1)}<div>① 校区：${S.campus ? (c1 ? '对得上' : `属于${CSHORT[f.campus]}`) : '用户没说 → 两边都留下，按校区分组'}</div></div>
    <div class="chk">${mark(c2)}<div>② 发布于 ${f.pub}${c2 ? '，在今天之前' : '，今天还没发布'}</div></div>
    <div class="chk">${mark(c3)}<div>③ 有效期 ${esc(vShort(f))} ${c3 ? '盖住' : '不含'} ${Tt}</div></div>
    <div class="chk">${mark(!revs)}<div>④ ${esc(revTxt)}</div></div>
    <div class="verdict ${vc}">${verdict}</div>
    <div class="kvs"><span>来源</span><span>${esc(noticeOf(d, f).title)}</span><span>引文</span><span>“${esc(f.quote)}”</span><span>校区来自</span><span>${esc(f.cSrc)}</span><span>编号</span><span style="font-family:var(--mono)">${f.id}</span></div>
    ${f.err ? `<div class="callout amber" style="margin-top:8px">⚠ ${esc(f.err)}</div>` : ''}</div>`;
}
function renderPanel(onlyRes){
  const box = $('#panel');
  if(onlyRes && S.step === 5 && $('#res')){
    $('#res').innerHTML = resultHTML(); $('#insp').innerHTML = inspectHTML(); wireInsp();
    $('#cDate').textContent = S.t; const d = ds(); $('#cT').value = Math.round((toMs(S.t) - toMs(d.window[0]))/DAY);
    document.querySelectorAll('.preset').forEach(b => b.classList.toggle('on', +b.dataset.i === S.preset));
    const qm = box.querySelector('.qm .chip'); if(qm) qm.textContent = `今天 ${S.t}`;
    return;
  }
  box.innerHTML = P[S.step]();
  box.scrollTop = 0;
  if(S.step === 3){
    box.querySelectorAll('#fsw button').forEach(b => b.onclick = () => { S.sel = b.dataset.sel; updateA(true); renderPanel(); });
  }
  if(S.step === 5){
    $('#res').innerHTML = resultHTML(); $('#insp').innerHTML = inspectHTML(); wireInsp();
    box.querySelectorAll('#cQ button').forEach(b => b.onclick = () => { S.q = b.dataset.v; S.preset = -1; updateB(); renderPanel(); });
    box.querySelectorAll('#cC button').forEach(b => b.onclick = () => { S.campus = b.dataset.v || null; S.preset = -1; updateB(); renderPanel(); });
    $('#cT').oninput = e => { const d = ds(); S.t = fromMs(toMs(d.window[0]) + e.target.value*DAY); S.preset = -1; updateB(); renderPanel(true); };
    box.querySelectorAll('.preset').forEach(b => b.onclick = () => { const p = PRESETS[S.ds][+b.dataset.i]; Object.assign(S, {t:p.t, campus:p.campus, q:p.q, preset:+b.dataset.i}); updateB(); renderPanel(); });
  }
}
function wireInsp(){ const x = $('#inspX'); if(x) x.onclick = () => { S.sel = null; markSel(); $('#insp').innerHTML = ''; updateB(); }; }

/* =====================================================================
   8. step control
   ===================================================================== */
function renderSteps(){
  $('#steps').innerHTML = STEPS.map((s, i) => `<button class="step ${S.step === i+1 ? 'active' : ''} ${S.step > i+1 ? 'done' : ''}" data-s="${i+1}">
    <span class="n">${S.step > i+1 ? '✓' : i+1}</span><span style="min-width:0"><div class="t1">${s.t1}</div><div class="t2">${s.t2}</div></span><span class="bar"></span></button>`).join('');
  document.querySelectorAll('.step').forEach(b => b.onclick = () => go(+b.dataset.s));
  $('#dots').innerHTML = STEPS.map((_, i) => `<i class="${S.step === i+1 ? 'on' : ''}"></i>`).join('');
  $('#prev').disabled = S.step === 1; $('#next').textContent = S.step === 5 ? '回到开头 ↺' : '下一步 →';
}
function stageTitle(){
  const t = {1:['一篇通知的原文', '2026-01-07《寒假期间综合服务保障体系各单位营业时间》'],
             2:['编译第一步：标题树（作用域树）', 'LLM 列出标题和每个标题引入的条件'],
             3:['编译第二步：事实挂到标题下，继承条件', '点卡片切换事实'],
             4:[S.ds === 'track' ? '田径场子图：时间 × 校区' : '东区浴室子图：修订边', '悬停看详情'],
             5:[S.ds === 'track' ? '田径场子图：拖动「今天」提问' : '东区浴室：拖动「今天」看修订如何生效', '拖动底部黑色把手，或用右侧预设']}[S.step];
  $('#stageTitle').innerHTML = `${t[0]}<small>${t[1]}</small>`;
  $('#dsSeg').style.display = S.step >= 4 ? '' : 'none';
  $('#swEdges').style.display = S.step >= 4 ? '' : 'none';
  $('#swFix').style.display = (S.step >= 3 && S.ds === 'track') ? '' : 'none';
  $('#swFix').classList.toggle('on', S.fix); $('#swEdges').classList.toggle('on', S.allEdges);
  document.querySelectorAll('#dsSeg button').forEach(b => b.classList.toggle('on', b.dataset.ds === S.ds));
}
function go(n){
  const prev = S.step; S.step = Math.max(1, Math.min(5, n));
  const aOn = S.step <= 3;
  $('#viewA').classList.toggle('off', !aOn); $('#viewB').classList.toggle('off', aOn);
  if(S.step === 3 && !fact(S.sel)?.id?.startsWith('b28eb1484c#') ) S.sel = 'b28eb1484c#62';
  if(S.step === 3 && !CARDPOS[S.sel]) S.sel = 'b28eb1484c#62';
  if(S.step === 2 && prev !== 2){ A.tree.querySelectorAll('.rise').forEach(e => { e.style.animation = 'none'; e.getBoundingClientRect(); e.style.animation = ''; }); }
  if(aOn) updateA(true);
  else { if(prev <= 3 || !B.pills) buildB(); else { drawStaticEdges(); updateB(); } }
  stageTitle(); renderSteps(); renderPanel(); hideTip();
}
$('#prev').onclick = () => go(S.step - 1);
$('#next').onclick = () => go(S.step === 5 ? 1 : S.step + 1);
document.addEventListener('keydown', e => { if(e.target.tagName === 'INPUT') return; if(e.key === 'ArrowRight') go(S.step + 1); if(e.key === 'ArrowLeft') go(S.step - 1); });
document.querySelectorAll('#dsSeg button').forEach(b => b.onclick = () => {
  S.ds = b.dataset.ds; S.preset = S.step === 5 ? 0 : S.preset;
  const p = PRESETS[S.ds][0]; if(S.step === 5 || S.ds === 'bath') Object.assign(S, {t:p.t, campus:p.campus, q:p.q, preset:0});
  if(S.ds === 'track' && S.step !== 5){ S.campus = null; S.q = 'today'; S.t = '2026-01-20'; }
  S.sel = null; buildB(); stageTitle(); renderPanel(); });
$('#swFix').onclick = () => { S.fix = !S.fix; if(S.fix && ERR.has(S.sel)) S.sel = S.step === 3 ? 'b28eb1484c#62' : null;
  if(S.step <= 3) updateA(true); else buildB(); stageTitle(); renderPanel(); };
$('#swEdges').onclick = () => { S.allEdges = !S.allEdges; drawStaticEdges(); updateB(); stageTitle(); };

/* =====================================================================
   9. boot (+ optional self-test against reference_engine.py vectors)
   ===================================================================== */
// deep links, e.g. ?step=5&ds=bath&t=2025-10-03  or  ?step=5&t=2025-12-28&q=寒假&campus=tz&fix=1&edges=1&sel=b28eb1484c%2362
const QS = new URLSearchParams(location.search);
if(QS.get('ds') === 'bath') S.ds = 'bath';
if(QS.get('fix') === '1') S.fix = true;
if(QS.get('edges') === '1') S.allEdges = true;
if(QS.get('t')) S.t = QS.get('t');
if(QS.get('q')) S.q = QS.get('q');
if(QS.has('campus')) S.campus = QS.get('campus') || null;
if(S.ds === 'bath' && !QS.get('t')) Object.assign(S, {t:PRESETS.bath[0].t, campus:'zgc', q:'today', preset:0});
if(S.ds === 'bath') S.campus = 'zgc', S.q = 'today';
if(QS.get('t') || QS.has('campus') || QS.get('q')) S.preset = PRESETS[S.ds].findIndex(p => p.t === S.t && p.campus === S.campus && p.q === S.q);
if(QS.get('sel')) S.sel = QS.get('sel');
buildA(); go(+QS.get('step') || 1);
if(QS.get('sel')){ S.sel = QS.get('sel'); if(S.step <= 3) updateA(true); else updateB(); renderPanel(); }
async function selftest(){
  const res = [];
  for(const [name, file] of [['track','test_vectors_track.json'],['bath','test_vectors_bath.json']]){
    const tv = await (await fetch(file)).json(), d = DATA[name]; let bad = 0; const ex = [];
    const ids = a => a.map(f => f.id).sort().join(',');
    for(const v of tv){
      const facts = d.facts.filter(f => !(v.corrected && ERR.has(f.id)));
      const r = engine(d, facts, v.t, v.campus, v.q);
      const br = JSON.stringify(Object.fromEntries(Object.keys(r.branches).sort().map(k => [k, r.branches[k].map(f => f.id).sort()])));
      const bv = JSON.stringify(Object.fromEntries(Object.keys(v.branches).sort().map(k => [k, v.branches[k]])));
      const cOk = (!r.costs && !v.costs) || (r.costs && v.costs && ['assume','enumerate','ask'].every(k => Math.abs(r.costs[k] - v.costs[k]) < 2e-3));
      const ok = r.mode === v.mode && ids(r.used) === v.used.join(',') && ids(r.rev) === v.revised.join(',') && ids(r.hist) === v.history.join(',')
        && br === bv && cOk && r.lo === v.target[0] && r.hi === v.target[1];
      if(!ok){ bad++; if(ex.length < 3) ex.push({v, r:{mode:r.mode, used:ids(r.used), rev:ids(r.rev), hist:ids(r.hist), br, lo:r.lo, hi:r.hi, costs:r.costs}}); }
    }
    res.push({name, total:tv.length, pass:tv.length - bad, examples:ex});
  }
  return res;
}
window.__selftest = selftest;
if(location.search.includes('selftest')) selftest().then(res => {
  const div = document.createElement('div'); div.className = 'selftest';
  div.textContent = res.map(r => `${r.name}: ${r.pass}/${r.total}`).join('   ·   ') + (res.every(r => r.pass === r.total) ? '   ✓ 与 Python 参考实现一致' : '   ✗ 有不一致');
  document.body.appendChild(div); console.log('selftest', res);
});
</script>
